name: Weekly Error Triage

# 매주 월요일 09:00 KST — 지난주 노션 QA 행을 원인별로 묶어 FE 수정 PR 1개 + FE/BE 이슈를 만든다.
# 절차·판정 기준·PR 본문 규격은 .github/weekly-triage/PROMPT.md 에 있다 (변경은 PR로 리뷰).
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      since:
        description: "대상 시작 (ISO, 예 2026-11-03T00:00:00+09:00). 비우면 지난주 월요일 00:00 KST"
        required: false
      until:
        description: "대상 끝, 배타 (ISO). 비우면 이번주 월요일 00:00 KST"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

# 주 1회 단일 실행. 겹치면 뒤 실행을 대기시키되 취소하지 않는다 (Pro 플랜 사용량 보호)
concurrency:
  group: weekly-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # 기본 GITHUB_TOKEN으로 만든 PR은 CI 워크플로우를 트리거하지 않는다 — PAT로 push해야 CI가 돈다
          token: ${{ secrets.TRIAGE_GH_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute period (KST)
        id: period
        env:
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_UNTIL: ${{ inputs.until }}
        run: |
          set -euo pipefail
          export TZ=Asia/Seoul
          # 이번주 월요일 00:00 KST
          this_monday=$(date -d "$(date +%Y-%m-%d) -$(( ($(date +%u) - 1) )) days" +%Y-%m-%dT00:00:00+09:00)
          last_monday=$(date -d "${this_monday%%T*} -7 days" +%Y-%m-%dT00:00:00+09:00)
          echo "since=${INPUT_SINCE:-$last_monday}" >> "$GITHUB_OUTPUT"
          echo "until=${INPUT_UNTIL:-$this_monday}" >> "$GITHUB_OUTPUT"
          echo "today=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Ensure labels
        env:
          GH_TOKEN: ${{ secrets.TRIAGE_GH_TOKEN }}
        run: |
          gh label create weekly-triage --color 5319E7 --description "주간 에러 트리아지 자동 생성" --force
          gh label create fe --color 1D76DB --description "프론트엔드" --force

      - name: Configure git identity
        run: |
          git config user.name "weekly-triage[bot]"
          git config user.email "weekly-triage@users.noreply.github.com"

      - name: Run Claude triage
        uses: anthropics/claude-code-action@v1
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_QA_DB_ID: ${{ secrets.NOTION_QA_DB_ID }}
          GH_TOKEN: ${{ secrets.TRIAGE_GH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            .github/weekly-triage/PROMPT.md 를 읽고 그대로 수행한다.
            대상 기간 since=${{ steps.period.outputs.since }} until=${{ steps.period.outputs.until }}
            오늘=${{ steps.period.outputs.today }}
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(pnpm:*),Bash(node:*),Bash(gh:*),Bash(git:*),Bash(curl:*),Read,Edit,Write,Glob,Grep"
